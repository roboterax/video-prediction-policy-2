[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vpp2"
version = "0.2.0"
description = 'Official implementation of "Video Prediction Policy 2: Predict Better, Act Better"'
requires-python = ">=3.10"
license = {file = "LICENSE"}
readme = "README.md"
dependencies = [
  "torch>=2.5", "torchvision>=0.20", "accelerate>=1.0", "hydra-core==1.3.2",
  "omegaconf==2.3.0", "transformers>=4.49,<5", "safetensors>=0.5",
  "numpy>=1.26,<2", "pandas>=2.2,<3", "pyarrow>=17", "av>=14",
  "einops>=0.8", "Pillow>=10", "h5py>=3.11", "rich>=13", "tqdm>=4.66",
  "imageio>=2.36", "imageio-ffmpeg>=0.5", "ftfy>=6.3", "regex>=2024.11",
]

[project.optional-dependencies]
prompt = ["transformers>=4.57.1,<5"]
train = ["deepspeed==0.18.5"]
eval = ["opencv-python>=4.10", "msgpack>=1.0", "websockets>=12"]
libero = ["datasets==3.6.0", "jsonlines==4.0.0", "opencv-python>=4.10", "PyYAML>=6", "filelock>=3"]
tracking = ["wandb>=0.19"]

[project.scripts]
vpp2 = "vpp2.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 100
